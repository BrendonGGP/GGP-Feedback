# Baseline administrativo para Codex 0.138.0+.
# Requirements são restrições; usuários não devem conseguir enfraquecê-las.
allowed_approval_policies = ["on-request"]
allowed_approvals_reviewers = ["user"]
allowed_web_search_modes = ["disabled", "cached"]
allow_login_shell = false
allow_remote_control = false
allow_appshots = false
allow_managed_hooks_only = true
check_for_update_on_startup = true
default_permissions = "org_guarded_workspace"

[computer_use]
allow_locked_computer_use = false

[allowed_permission_profiles]
":read-only" = true
org_guarded_workspace = true
":workspace" = false
":danger-full-access" = false

[permissions.org_guarded_workspace]
description = "Workspace corporativo com leitura mínima, secrets negados e rede desligada."
extends = ":workspace"

[permissions.org_guarded_workspace.filesystem]
glob_scan_max_depth = 8

[permissions.org_guarded_workspace.filesystem.":workspace_roots"]
"**/.env" = "deny"
"**/.env.*" = "deny"
"**/*.pem" = "deny"
"**/*.key" = "deny"
"**/credentials*" = "deny"
"**/.ssh/**" = "deny"
"**/.aws/**" = "deny"
"**/.azure/**" = "deny"
"**/.config/gcloud/**" = "deny"
"**/.kube/config" = "deny"

[permissions.org_guarded_workspace.network]
enabled = false

[permissions.filesystem]
deny_read = [
  "/**/.env",
  "/**/.env.*",
  "/**/*.pem",
  "/**/*.key",
  "~/.ssh/**",
  "~/.aws/**",
  "~/.azure/**",
  "~/.config/gcloud/**",
  "~/.kube/config"
]

[features]
hooks = false
memories = false
multi_agent = false
plugins = false
remote_plugin = false
skill_mcp_dependency_install = false
in_app_browser = false
workspace_dependencies = false

# A presença desta tabela vazia funciona como allowlist vazia e desabilita MCPs.
[mcp_servers]

[rules]
prefix_rules = [
  { pattern = [{ token = "rm" }, { any_of = ["-rf", "-fr"] }], decision = "forbidden", justification = "Exclusão recursiva forçada é bloqueada; use seleção explícita e rollback." },
  { pattern = [{ token = "rm" }], decision = "prompt", justification = "Remoções exigem revisão do alvo e da reversibilidade." },
  { pattern = [{ token = "git" }, { token = "reset" }, { token = "--hard" }], decision = "forbidden", justification = "Pode destruir alterações locais; use restauração seletiva." },
  { pattern = [{ token = "git" }, { token = "clean" }], decision = "prompt", justification = "Execute dry-run e obtenha aprovação antes de apagar arquivos não rastreados." },
  { pattern = [{ token = "git" }, { token = "push" }, { any_of = ["--force", "-f", "--force-with-lease"] }], decision = "forbidden", justification = "Reescrita de histórico remoto é bloqueada." },
  { pattern = [{ token = "git" }, { token = "push" }], decision = "prompt", justification = "Push é efeito externo e exige aprovação." },
  { pattern = [{ any_of = ["bash", "sh", "zsh", "pwsh", "powershell", "cmd"] }], decision = "prompt", justification = "Shell interpretado exige aprovação e inspeção do comando completo." },
  { pattern = [{ token = "terraform" }, { token = "destroy" }], decision = "forbidden", justification = "Destruição de infraestrutura deve ocorrer apenas pelo pipeline autorizado." },
  { pattern = [{ token = "terraform" }, { token = "apply" }], decision = "prompt", justification = "Aplicação de infraestrutura exige plano, revisão e aprovação." },
  { pattern = [{ token = "kubectl" }, { any_of = ["apply", "delete", "patch", "replace", "scale"] }], decision = "prompt", justification = "Mutação de cluster exige contexto, namespace e aprovação." },
  { pattern = [{ any_of = ["npm", "pnpm", "yarn"] }, { token = "publish" }], decision = "prompt", justification = "Publicação de pacote exige revisão e aprovação." },
  { pattern = [{ token = "twine" }, { token = "upload" }], decision = "prompt", justification = "Publicação de pacote Python exige revisão e aprovação." },
  { pattern = [{ any_of = ["aws", "gcloud", "az"] }], decision = "prompt", justification = "CLIs de cloud podem acessar ou alterar recursos externos." }
]
