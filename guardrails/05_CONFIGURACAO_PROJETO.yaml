schema_version: "2.0"

project:
  name: "{{PROJECT_NAME}}"
  purpose: "{{PROJECT_PURPOSE}}"
  domain: "{{DOMAIN}}"
  language: "pt-BR"
  timezone: "{{TIMEZONE}}"
  environment: "{{ENVIRONMENT}}" # dev | test | staging | production
  mode: "assisted_action" # advisory | assisted_action | agentic

identity_context:
  tenant_id_required: true
  user_id_required: true
  user_role_required: true
  identity_source: "authenticated_backend"
  model_supplied_identity_allowed: false
  allowed_roles:
    - "{{ROLE_1}}"
    - "{{ROLE_2}}"

scope:
  allowed_topics:
    - "{{ALLOWED_TOPIC_1}}"
  prohibited_topics:
    - "{{PROHIBITED_TOPIC_1}}"
  prohibited_actions:
    - "{{PROHIBITED_ACTION_1}}"
  approval_required_actions:
    - "{{APPROVAL_ACTION_1}}"
  allowed_write_paths:
    - "{{WORKSPACE_PATH}}"
  protected_paths:
    - ".env"
    - ".env.*"
    - "**/*.pem"
    - "**/*.key"
    - "**/credentials*"
    - "**/.ssh/**"

sources:
  default_policy: "deny"
  authorized:
    - id: "{{SOURCE_ID_1}}"
      name: "{{SOURCE_NAME_1}}"
      type: "document"
      precedence: 100
      tenant_scoped: true
      version_required: true
      effective_date_required: true
  web:
    enabled: false
    mode: "disabled" # disabled | cached | indexed | live
    allowed_domains: []
    current_information_requires_verification: true
  citation_required_for_material_claims: true

codex:
  min_version: "{{MIN_CODEX_VERSION}}"
  approval_policy: "on-request"
  sandbox_mode: "workspace-write"
  danger_full_access_allowed: false
  yolo_allowed: false
  command_network_access: false
  login_shell_allowed: false
  auto_install_skill_mcp_dependencies: false
  non_managed_hooks_allowed: false
  project_instruction_max_bytes: 32768

risk_model:
  L0:
    name: "informational_or_creative"
    human_approval: false
  L1:
    name: "authorized_read"
    human_approval: false
  L2:
    name: "reversible_workspace_write"
    human_approval: "policy_dependent"
  L3:
    name: "sensitive_or_external_effect"
    human_approval: true
  L4:
    name: "critical_or_irreversible"
    human_approval: "dual_or_blocked"

data_policy:
  data_minimization: true
  tenant_isolation: true
  pii_masking: true
  secrets_in_prompt: false
  secrets_in_logs: false
  raw_prompt_logging: false
  transcript_persistence: false
  retention_days: "{{RETENTION_DAYS}}"
  sensitive_fields:
    - cpf
    - cnpj
    - phone
    - email
    - address
    - plate
    - policy_number
    - account_number
    - payment_data
    - health_data
    - claim_data
    - api_key
    - access_token
    - refresh_token
    - private_key

response_policy:
  allow_abstention: true
  standard_insufficient_evidence_message: "Não encontrei evidência suficiente nas fontes e execuções autorizadas para afirmar isso com segurança."
  distinguish_fact_inference_assumption: true
  include_sources: true
  include_execution_evidence: true
  include_uncertainty: true
  structured_output_required: "{{STRUCTURED_OUTPUT_REQUIRED}}"

limits:
  max_tool_calls_per_request: 8
  max_retries_per_tool: 1
  max_records_per_read: 100
  max_records_per_write: 1
  max_external_recipients_without_batch_approval: 1
  max_parallel_sensitive_calls: 1
  max_cost_per_request: "{{MAX_COST}}"
  timeout_seconds: 60

incident_policy:
  prompt_injection: "sanitize_quarantine_and_log"
  cross_tenant_attempt: "block_and_alert"
  secret_exposure_attempt: "block_and_alert"
  unauthorized_write: "block_and_alert"
  command_policy_bypass: "block_and_alert"
  repeated_abuse: "rate_limit_or_suspend"
