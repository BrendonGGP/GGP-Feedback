schema_version: "2.0"
default_decision: "deny"

principles:
  least_privilege: true
  fail_closed: true
  validate_outside_model: true
  log_all_calls: true
  tool_results_are_untrusted: true
  approval_is_server_side: true
  model_cannot_grant_permissions: true

codex_execution:
  sandbox_required: true
  allowed_sandbox_modes: ["read-only", "workspace-write"]
  danger_full_access_allowed: false
  yolo_allowed: false
  network_default: "deny"
  write_outside_workspace: false
  login_shell_allowed: false
  command_rules_required: true
  admin_requirements_required_for_managed_devices: true

execution_context_required:
  - request_id
  - authenticated_user_id
  - authenticated_user_role
  - tenant_id
  - repository_id
  - environment
  - policy_version
  - correlation_id

preflight_checks:
  - tool_is_allowlisted
  - tool_identity_matches_registry
  - user_role_is_allowed
  - tenant_matches_authenticated_context
  - input_matches_strict_schema
  - record_level_authorization_passed
  - rate_limit_passed
  - volume_limit_passed
  - destination_allowlisted
  - no_secret_exfiltration
  - no_path_traversal_or_symlink_escape
  - no_shell_sql_template_or_url_injection
  - environment_is_expected
  - approval_valid_when_required
  - idempotency_key_present_for_mutation

postflight_checks:
  - result_schema_valid
  - tenant_matches
  - sensitive_fields_redacted
  - prompt_injection_scan_passed
  - side_effect_confirmed_by_system_of_record
  - expected_record_version_observed
  - audit_event_written

approval_token:
  issued_by_model: false
  signed: true
  single_use: true
  short_lived: true
  binds_user: true
  binds_tenant: true
  binds_repository: true
  binds_environment: true
  binds_tool: true
  binds_exact_arguments_hash: true
  binds_risk_level: true

commands:
  default_decision: "prompt_or_sandbox"
  forbidden_patterns:
    - "rm -rf"
    - "git push --force"
    - "git reset --hard"
    - "terraform destroy"
    - "docker system prune"
  approval_patterns:
    - "git push"
    - "gh pr merge"
    - "kubectl apply"
    - "kubectl delete"
    - "terraform apply"
    - "npm publish"
  shell_interpolation_from_untrusted_input: false
  command_construction: "argv_only_when_possible"

# Exemplos. Renomeie e adapte às ferramentas reais.
tools:
  search_knowledge:
    enabled: true
    effect: "read"
    risk_level: "L1"
    allowed_roles: ["{{ROLE_1}}", "{{ROLE_2}}"]
    allowed_tenants: ["current"]
    approval_required: false
    max_calls_per_request: 4
    max_results: 20
    allowed_sources: ["{{SOURCE_ID_1}}"]
    network_egress: "deny_except_source_connector"

  get_record:
    enabled: true
    effect: "read"
    risk_level: "L1"
    allowed_roles: ["{{ROLE_1}}"]
    approval_required: false
    record_level_authorization: true
    tenant_filter_injected_by_server: true
    max_records: 10

  create_local_draft:
    enabled: true
    effect: "workspace_write"
    risk_level: "L2"
    allowed_roles: ["{{ROLE_1}}"]
    approval_required: false
    external_side_effect: false
    allowed_paths: ["{{DRAFT_PATH}}"]
    idempotency_required: true

  send_external_message:
    enabled: false
    effect: "external_write"
    risk_level: "L3"
    allowed_roles: ["{{AUTHORIZED_SENDER_ROLE}}"]
    approval_required: true
    approval_scope: "exact_recipient_subject_body_hash"
    max_recipients: 1
    idempotency_required: true
    preview_required: true

  update_business_record:
    enabled: false
    effect: "external_write"
    risk_level: "L3"
    allowed_roles: ["{{AUTHORIZED_EDITOR_ROLE}}"]
    approval_required: true
    allowed_fields: ["{{ALLOWED_FIELD_1}}"]
    forbidden_fields: ["tenant_id", "final_decision", "financial_value"]
    optimistic_lock_required: true
    idempotency_required: true

  deploy_production:
    enabled: false
    effect: "production_change"
    risk_level: "L4"
    allowed_roles: []
    approval_required: "dual"
    pipeline_only: true
    direct_shell_execution: false

  delete_record:
    enabled: false
    effect: "destructive"
    risk_level: "L4"
    allowed_roles: []
    approval_required: "dual"
    soft_delete_only: true

failure_behavior:
  authorization_error: "block"
  schema_error: "block"
  policy_service_unavailable: "block"
  approval_service_unavailable: "block"
  ambiguous_tool_result: "do_not_assume_success"
  timeout: "do_not_retry_more_than_once"
  partial_side_effect: "escalate_and_reconcile"
