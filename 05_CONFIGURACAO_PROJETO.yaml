schema_version: "2.0"

project:
  name: "GGP-Feedback"
  purpose: "Plataforma interna para gestão de ciclos e feedbacks de colaboradores do grupo GGP."
  purpose_status: "configured"
  domain: "human_resources_feedback"
  language: "pt-BR"
  timezone: "America/Sao_Paulo"
  environment: "development"
  mode: "assisted_action"

identity_context:
  backend_configured: false
  tenant_model: "single_organization_multi_company_planned"
  authenticated_identity_required_for_external_effects: true
  model_supplied_identity_allowed: false
  local_role: "workspace_user"

scope:
  allowed_topics:
    - "engenharia e configuração deste workspace"
    - "documentação e análise do projeto"
    - "guardrails e hardening local"
    - "desenvolvimento da plataforma interna de feedback"
    - "modelagem e versionamento local do banco de dados"
  prohibited_actions:
    - "ler secrets ou credenciais"
    - "escrever fora do workspace"
    - "usar rede sem aprovação"
    - "alterar produção ou infraestrutura"
    - "executar ação externa sem aprovação verificável"
  approval_required_actions:
    - "instalar dependência de produção"
    - "usar rede por subprocesso"
    - "git push, merge, release ou publicação"
    - "habilitar MCP, plugin ou tool externa"
  allowed_write_paths:
    - ":workspace_roots"
  protected_paths:
    - ".env"
    - ".env.*"
    - "**/*.pem"
    - "**/*.key"
    - "**/credentials*"
    - "**/.ssh/**"
    - "**/.aws/**"
    - "**/.azure/**"
    - "**/.config/gcloud/**"
    - "**/.kube/config"

sources:
  default_policy: "deny"
  authorized:
    - id: "repository_evidence"
      name: "Arquivos do workspace relevantes à tarefa"
      type: "repository"
      precedence: 100
      current_state_required: true
    - id: "guardrails_baseline"
      name: "Kit local de guardrails"
      type: "policy"
      path: "guardrails/"
      precedence: 90
  web:
    enabled: false
    mode: "disabled"
    allowed_domains: []
    current_information_requires_verification: true
  citation_required_for_material_claims: true

codex:
  minimum_supported_version: "0.138.0"
  observed_version: "0.146.0-alpha.3"
  approval_policy: "on-request"
  permission_profile: "project_guarded_workspace"
  danger_full_access_allowed: false
  yolo_allowed: false
  command_network_access: false
  login_shell_allowed: false
  auto_install_skill_mcp_dependencies: false
  project_instruction_max_bytes: 32768

risk_model:
  L0: { human_approval: false }
  L1: { human_approval: false }
  L2: { human_approval: "policy_dependent" }
  L3: { human_approval: true }
  L4: { human_approval: "dual_or_blocked" }

data_policy:
  data_minimization: true
  tenant_isolation_required_when_backend_exists: true
  pii_masking: true
  secrets_in_prompt: false
  secrets_in_logs: false
  raw_prompt_logging: false
  transcript_persistence: false
  retention_days: 0

response_policy:
  allow_abstention: true
  standard_insufficient_evidence_message: "Não encontrei evidência suficiente nas fontes e execuções autorizadas para afirmar isso com segurança."
  distinguish_fact_inference_assumption: true
  include_execution_evidence: true
  include_uncertainty: true
  structured_output_required: false

limits:
  max_tool_calls_per_request: 8
  max_retries_per_tool: 1
  max_parallel_sensitive_calls: 1
  timeout_seconds: 60

incident_policy:
  prompt_injection: "sanitize_quarantine_and_log_when_logging_exists"
  cross_tenant_attempt: "block_and_alert_when_backend_exists"
  secret_exposure_attempt: "block"
  unauthorized_write: "block"
  command_policy_bypass: "block"
