name: Automatic pull request

on:
  push:
    branches-ignore: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  open-or-update:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_BRANCH: ${{ github.ref_name }}
      BASE_BRANCH: main
    steps:
      - name: Open pull request when absent
        shell: bash
        run: |
          set -euo pipefail

          existing="$(gh pr list \
            --repo "$GH_REPO" \
            --head "$HEAD_BRANCH" \
            --base "$BASE_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -n "$existing" ]]; then
            echo "Pull request #$existing already exists."
            exit 0
          fi

          gh pr create \
            --repo "$GH_REPO" \
            --head "$HEAD_BRANCH" \
            --base "$BASE_BRANCH" \
            --title "Merge $HEAD_BRANCH into $BASE_BRANCH" \
            --body "Pull request created automatically after a push to branch $HEAD_BRANCH."
