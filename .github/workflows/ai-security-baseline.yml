name: AI security baseline

on:
  pull_request:
    branches: [main]
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24.18.0"
          cache: npm
      - name: Install application dependencies
        run: npm ci --ignore-scripts --audit=false --fund=false
      - name: Lint application
        run: npm run lint
      - name: Type-check application
        run: npm run typecheck
      - name: Test application
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build application
        run: npm run build
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - name: Install validation dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --no-cache-dir
          --only-binary=:all:
          --require-hashes
          -r requirements-validation.txt
      - name: Validate active local hardening
        run: python -B scripts/validate_local_hardening.py
      - name: Validate guardrails source package
        run: python -B guardrails/scripts/validate_package.py
      - name: Unit tests
        run: python -B -m unittest discover -s guardrails/tests -v
      - name: Python syntax
        run: python -m compileall -q scripts guardrails/examples guardrails/scripts guardrails/tests guardrails/.agents/skills
