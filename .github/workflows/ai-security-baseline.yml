name: AI security baseline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - name: Install validation dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --no-cache-dir
          --only-binary=:all:
          --require-hashes
          -r requirements-validation.txt
      - name: Validate active local hardening
        run: python -B scripts/validate_local_hardening.py
      - name: Validate guardrails source package
        run: python -B guardrails/scripts/validate_package.py
      - name: Unit tests
        run: python -B -m unittest discover -s guardrails/tests -v
      - name: Python syntax
        run: python -m compileall -q scripts guardrails/examples guardrails/scripts guardrails/tests guardrails/.agents/skills
